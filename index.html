<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>Mega Ultimate Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start-screen">
  <h1>Mega Tic Tac Toe</h1>
  <div id="start-buttons">
    <button id="btn-new-game">Start New Game</button>
    <button id="btn-resume-game">Resume Game</button>
  </div>
</div>

<div id="new-game-popup" class="popup hidden">
  <div class="popup-content">
    <h2>Create New Game</h2>
    <label>Player 1 Name:
      <input type="text" id="player1-name" placeholder="Player 1">
    </label>
    <label>Player 2 Name:
      <input type="text" id="player2-name" placeholder="Player 2">
    </label>
    <button id="btn-create-game">Create</button>
    <button id="btn-cancel-new">Cancel</button>
  </div>
</div>

<div id="resume-screen" class="hidden">
  <h2>Saved Games</h2>
<div id="sort-container">

    <label for="save-filter">
    Show:
</label>

<select id="save-filter">

    <option value="all">
        All Games
    </option>

    <option value="unfinished">
        Active Games
    </option>

    <option value="finished">
        Finished Games
    </option>

</select>

    <label for="save-sort">
        Sort By:
    </label>

    <select id="save-sort">

        <option value="recent">
            Recently Played
        </option>

        <option value="oldest">
            Oldest Played
        </option>

        <option value="player1">
            Player 1 A - Z
        </option>

        <option value="player2">
            Player 2 A - Z
        </option>

        <option value="moves-high">
            Most Moves
        </option>

        <option value="moves-low">
            Least Moves
        </option>

    </select>

</div>

<div id="save-list"></div>
  <button id="btn-back-to-start">Back</button>
</div>

<div id="map-screen" class="hidden">

<div id="free-move-banner" class="hidden">
  FREE MOVE
</div>
    
  <h2 id="game-title"></h2>
  <div id="mega-board"></div>

  <div id="history-controls">
    <button id="btn-history-back">← Back</button>
    <button id="btn-history-forward">Forward →</button>
  </div>

  <div id="turn-arrow-container">
    <button id="btn-go-to-current" class="turn-arrow">Continue</button>
  </div>

  <button id="btn-exit-to-start">Exit to Start</button>
</div>

<div id="zoom-screen" class="hidden">
  <h2 id="zoom-title" class="hidden"></h2>
  <div id="zoom-board"></div>
  <button id="btn-back-to-map">← Back to map</button>
</div>

<script src="script.js"></script>
</body>
</html>
